  # ---------------------------------------------------------- LPC tile atlas
  # terrain_atlas.png collects LPC base assets and LPC entries. Its
  # Attribution.txt gives CC-BY-SA 3.0 and GPL 3.0 for the collection; the only
  # GPL/LGPL-only part (Johann Charlot's shoot'em up kit) is not in the ruins
  # and standing-stone tiles used here (rows 12-16, columns 14-20).
  - files: ["lpc:lpc-tile-atlas/files/terrain_atlas.png#ruins"]
    title: LPC tile atlas (ruins and standing stones)
    licences: [CC-BY-SA 3.0, GPL 3.0]
    authors: [Lanea Zimmerman (Sharm), Casper Nilsson, Daniel Eddeland, Skyler Robert Colladay, Stephen Challener (Redshrike), Charles Sanchez (CharlesGabriel), Manuel Riecke (MrBeast), Daniel Armstrong (HughSpectrum)]
    urls: [https://opengameart.org/content/lpc-tile-atlas]
    notes: The atlas does not attribute individual tiles; all its non-LGPL contributors are credited.
  - files: ["lpc:lpc-tile-atlas/files/terrain_atlas.png", "lpc:lpc-tile-atlas/files/base_out_atlas.png", "lpc:lpc-tile-atlas2/files/*.png"]
    title: LPC tile atlas (unreviewed regions; may contain LGPL-only art)
    licences: [GPL 3.0, LGPL 3.0]
    authors: [see Attribution.txt]
    urls: [https://opengameart.org/content/lpc-tile-atlas]
    notes: Use only reviewed regions (referenced with a #region suffix and listed above).

