  - files: ["lpc:lpc-revised/Terrain/terrain_*.png"]
    title: LPC Revised terrain (grass and dirt)
    licences: [OGA-BY 3.0]
    authors: [Lanea Zimmerman (Sharm), Eliza Wyatt (DeathsDarling)]
    urls: [https://github.com/ElizaWy/LPC, https://opengameart.org/content/liberated-pixel-cup-lpc-base-assets-sprites-map-tiles]
    notes: Original grass and dirt by Lanea Zimmerman; edited, animated and recolored by Eliza Wyatt. Ember variants recolored by the baker.
  - files: ["lpc:lpc-revised/Terrain/trees_*.png"]
