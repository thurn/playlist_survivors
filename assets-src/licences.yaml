# Licence manifest for every non-generator source file the baker may use.
#
# Generator art (ulpc: references) is licensed by the generator's CREDITS.csv
# and is not listed here. Every other source reference must match one of the
# `files` glob patterns below (first match wins; `*` stays inside one path
# segment, `**` crosses segments):
#   lpc:<path under ~/Documents/lpc>
#   dl:<source id from tools/baker/sources.json>/<path inside the archive>
#
# Allowed licences: CC0, CC-BY, OGA-BY, CC-BY-SA. GPL-only and LGPL-only art
# is rejected: an entry whose licences are all disallowed makes the bake fail
# if anything matching it is used. When several licences are listed, the
# credits record the least restrictive allowed one
# (CC0 < OGA-BY < CC-BY < CC-BY-SA).

