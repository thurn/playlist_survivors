# The Galop trailer: 30 seconds of play, filmed as the game draws it (its camera and its HUD) from
# reactive mode's skilled virtual player (the hero never hurt): the Infernal Galop's theme A,
# crossfading into NotJam's "Critical Theme", a different song and a different scene.
# Build it with `npm run trailer -- trailer/galop.yaml` (scripts/trailer.ts documents the options).
title: Playlist Survivors — Galop trailer
width: 1920
height: 1080
fps: 60

runs:
  # Reactive mode (where enemies step on the beat), its skilled player pressing on each track's
  # reference beats. The Galop's positions are in bars (songs/orpheus-galop/form.md); Critical's
  # in seconds (106 BPM, a downbeat every 1.132 s from 0.566 s).
  galop: { query: mode=reactive&track=orpheus-galop&player=reactive-skilled&nodamage, songMap: orpheus-galop }
  critical: { query: mode=reactive&track=notjam-critical-theme&player=reactive-skilled&nodamage }

# Theme A once, from the beat before its first downbeat; then Critical from a downbeat in its dark
# ember zone, through the transform wave into its blue zone (about 77 s), fading out on a downbeat
# before the wave back to green (about 90.5 s).
cuts:
  - { run: galop, from: "53:2", to: "70" }
  - { run: critical, from: 70.76, to: 90.0, crossfadeMs: 1000 }
crossfadeMs: 24
fadeIn: 0.15
fadeOut: 1.2
audio: { sfx: 0.9, gain: 1 }
