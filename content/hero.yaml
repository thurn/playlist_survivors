# The hero: movement model, timing windows, groove and swings.
# See docs/design/beat-steps.md. Animations name baked hero animations in
# public/assets/characters.json.
hero:
  step: { length: 44, durationMs: 110, hop: 5, diagonalWindowMs: 40 }
  # Play mode's fixed-speed strides (rules.strides; see docs/design/gameplay-redesign.md): the hero
  # moves at the walk speed, a stride lasting durationMs. The stride period is one step of the
  # timing grid, halved while longer than maxPeriodS, or freePeriodS without a steady beat. Two
  # opposite keys within stompMs (or Space) stomp: the hero stays put.
  stride: { durationMs: 110, hop: 5, maxPeriodS: 0.4, freePeriodS: 0.35, stompMs: 40 }
  walk: { speed: 80, accelMs: 60, strideCycle: 64 }
  timing: { perfectMs: 35, greatMs: 70, goodMs: 120, floor: 0.1 }
  groove: { follow: 0.3, idleHalfLifeBars: 8, maxBonus: 0.2, offbeatBonus: 0.25, stumble: 0.5 }
  swings:
    minLeadMs: 90
    windupMs: 190
    light: { animations: [slash, backslash, halfslash], hitShape: { kind: arc, radius: 100, degrees: 150 }, damage: 1.0 }
    heavy: { animation: slash-oversize, hitShape: { kind: arc, radius: 130, degrees: 200 }, damage: 2.5, hitStopMs: 110, wave: { to: 330, band: 25, damage: 1.0 } }
  # Play mode's health: each enemy touching the hero bites at most once per biteEveryMs. Rhythm
  # heals: a press rated Great or better heals `beat`, and from the 4th such beat in a row each
  # heals `streak` more; a lesser press or a stumble ends the streak.
  health: { max: 5000, biteEveryMs: 600, heal: { beat: 15, streakFrom: 4, streak: 15 } }
  # The boss outweighs a crowd of hundreds; formation members draw a cleave to the line.
  aimWeights: { regular: 1, elite: 2, boss: 1000, formation: 20 }
