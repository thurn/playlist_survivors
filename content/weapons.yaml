# Automatic weapons granted by level-ups, plus the one-off finale blast.
weapons:
  - id: orbiting-blades
    name: Orbiting Blades
    kind: orbit
    fires: { every: eighth }
    orbit:
      count: 3
      radius: 72
      periodBars: 1
      tiers: [{ count: 3, radius: 72 }, { count: 3, radius: 90 }, { count: 4, radius: 105 }, { count: 5, radius: 120 }]
    hitShape: { kind: circle, radius: 14 }
    damage: 0.6                  # to each enemy a blade touches, on each eighth note
    weight: light
    effect: blades-hit
    sound: weapon-blades
    icon: blades
    color: "#bfe8ff"
    evolve: { name: Blades Evolve, count: 2, radiusScale: 1.2 }   # play mode: two more blades, an orbit 20% wider
  - id: chain-lightning
    name: Chain Lightning
    kind: chain
    fires: { every: bar }
    chain:
      jumps: [2, 4]
      step: sixteenth
      range: 110
      tiers: [{ jumps: 3, range: 110 }, { jumps: 4, range: 125 }, { jumps: 5, range: 140 }, { jumps: 6, range: 160 }]
    hitShape: { kind: circle, radius: 16 }
    damage: 1.2                  # per jump
    weight: medium
    effect: lightning-hit
    sound: weapon-lightning
    icon: lightning
    color: "#a8c8ff"
    evolve: { name: Lightning Evolves, every: beat, jumps: 1 }    # play mode: every beat, one more jump
  - id: fire-trail
    name: Fire Trail
    kind: trail
    fires: { every: beat }
    trail:
      beats: 2
      spacing: 18
      tiers: [{ radius: 20 }, { radius: 26 }, { radius: 32 }, { radius: 38 }]
    hitShape: { kind: circle, radius: 20 }
    damage: 0.4                  # per beat, to everything in the trail
    weight: light
    effect: fire-hit
    sound: weapon-fire
    icon: fire
    color: "#ff8a3a"
  - id: finale-blast
    name: Finale Blast
    kind: blast
    fires: { every: sixteenth }
    blast: { beats: 1, step: sixteenth, radius: 900 }
    damage: 1000                 # kills anything
    weight: heavy
    effect: blast-hit
    sound: blast
    icon: blast
    color: "#fff2c0"
