# Automatic weapons granted by level-ups, plus the one-off finale blast.
weapons:
  - id: orbiting-blades
    name: Orbiting Blades
    kind: orbit
    fires: { every: eighth }
    orbit: { count: 3, radius: 72, periodBars: 1 }
    hitShape: { kind: circle, radius: 14 }
    damage: 0.6                  # to each enemy a blade touches, on each eighth note
    weight: light
    effect: blades-hit
    sound: weapon-blades
    icon: blades
    color: "#bfe8ff"
  - id: chain-lightning
    name: Chain Lightning
    kind: chain
    fires: { every: bar }
    chain: { jumps: [2, 4], step: sixteenth, range: 110 }
    hitShape: { kind: circle, radius: 16 }
    damage: 1.2                  # per jump
    weight: medium
    effect: lightning-hit
    sound: weapon-lightning
    icon: lightning
    color: "#a8c8ff"
  - id: fire-trail
    name: Fire Trail
    kind: trail
    fires: { every: beat }
    trail: { beats: 2, spacing: 18 }
    hitShape: { kind: circle, radius: 20 }
    damage: 0.4                  # per beat, to everything in the trail
    weight: light
    effect: fire-hit
    sound: weapon-fire
    icon: fire
    color: "#ff8a3a"
  - id: finale-blast
    name: Finale Blast
    kind: blast
    fires: { every: sixteenth }
    blast: { beats: 1, step: sixteenth, radius: 900 }
    damage: 1000                 # kills anything
    weight: heavy
    effect: blast-hit
    sound: blast
    icon: blast
    color: "#fff2c0"
