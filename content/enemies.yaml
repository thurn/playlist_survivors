# The Can-Can roster. `atlas` names a sprite in public/assets/characters.json.
# A light swing deals 1.0 damage before the groove bonus (up to +20%), so
# health just above 1.0 dies to one swing only at a high groove.
enemies:
  - id: slime
    atlas: slime
    radius: 10
    group: beat
    speed: 90
    health: 0.8
    size: regular
    walkCycleBeats: 1
    hop: true
    death: { recipe: death-slime, debris: ["#7ad04a", "#c8f07a"] }
  - id: bat
    atlas: bat
    radius: 10
    group: eighth
    speed: 165
