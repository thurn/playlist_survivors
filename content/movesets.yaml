# Choreography styles, one per song section. See docs/design/tech-demo.md, "Movesets".
movesets:
  - id: spinning-glide
    locomotion: { mode: glide }
    travelSpeed: 30
    path: figure-eight
    pathSize: 70
    continuous: { move: spin, everyBeats: 2 }
    onAnchor: { move: burst, minStrength: 0.5 }

  - id: herald-cleaves
    locomotion: { mode: step, every: bar }
    travelSpeed: 40
    path: forward
    grid: beat
    attacks:
      - pattern: "x."              # slash on each downbeat
        moves: [slash, backslash]
      - onAccent: { label: tutti-chord, move: cleave }

  - id: galop-steps
    locomotion: { mode: step, every: beat }
    travelSpeed: 50
    path: zigzag
    pathSize: 60
    grid: eighth                 # in 2/4, a bar has 4 eighth-note slots
    directions: [left, right, ahead, ahead]
    attacks:
      - pattern: "x.x."            # a slash on each beat
        moves: [slash, backslash]
      - onAccent: { minStrength: 0.7, move: cleave }
      - onSectionEnd: dash-strike

  - id: galop-dashes
    extends: galop-steps
    travelSpeed: 55
    attacks:
      - pattern: "x...|...."       # dash-strike on beat 1 of every second bar
        moves: [dash-strike]

  - id: kick-line-dance
    locomotion: { mode: step, every: bar }
    travelSpeed: 12
    path: circle
    pathSize: 50
    grid: eighth
    directions: [left, right, behind, left]
    attacks:
      - pattern: "x.x."
        moves: [slash, backslash, halfslash]
      - onAccent: { minStrength: 0.85, move: cleave }

  - id: descent-steps
    locomotion: { mode: step, every: beat }
    travelSpeed: 55
    path: forward
    pathSize: 30
    grid: eighth
    directions: [ahead, left, ahead, right]
    attacks:
      - pattern: "x.x."
        moves: [thrust, slash]
      - onAccent: { minStrength: 0.7, move: dash-strike }
      - onSectionEnd: cleave

  - id: revel-onslaught
    locomotion: { mode: dash, every: beat }
    travelSpeed: 20
    path: figure-eight
    pathSize: 80
    grid: eighth
    directions: [left, right, ahead, behind]
    attacks:
      - pattern: "x.x."
        moves: [slash, backslash]
      - onAccent: { minStrength: 0.7, move: cleave }

  - id: finale-frenzy
    extends: revel-onslaught
    travelSpeed: 15
    attacks:
      - pattern: "x.x.|x.xx"
        moves: [slash, backslash, halfslash]
      - onAccent: { minStrength: 0.6, move: cleave }
