# Effect recipes. Art names: "proc:<name>" is a procedural texture generated at load;
# "fx:<id>" is an animation in public/assets/effects.json. Ranges [low, high] are
# interpolated by intensity (section intensity × energy × weight × accent strength).
effects:
  - id: hit-light
    layers:
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.26, align: hitShape, additive: true, tint: "#7fc8ff", scale: [1.08, 1.16] }
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.2, align: hitShape, additive: true, tint: "#ffffff" }
      - { kind: burst, art: "proc:spark", count: [12, 24], speed: [140, 300], life: 0.4, clock: world, drag: 3, spread: 150, size: [1.2, 1.8] }
      - { kind: shake, trauma: [0.16, 0.3] }
      - { kind: light, color: "#d8f0ff", radius: [90, 150], life: 0.16, clock: song, strength: [1, 1.4] }
  - id: hit-medium
    layers:
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.3, align: hitShape, additive: true, tint: "#a0b8ff", scale: [1.1, 1.2] }
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.22, align: hitShape, additive: true, tint: "#ffffff" }
      - { kind: burst, art: "proc:spark", count: [18, 32], speed: [160, 340], life: 0.45, clock: world, drag: 2.5, spread: 170, size: [1.3, 2] }
      - { kind: shake, trauma: [0.22, 0.36] }
      - { kind: light, color: "#d0e0ff", radius: [110, 170], life: 0.18, clock: song, strength: [1.2, 1.6] }
  - id: hit-heavy
    layers:
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.36, align: hitShape, additive: true, tint: "#ffb040", scale: [1.12, 1.25] }
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.28, align: hitShape, additive: true, tint: "#fff4d0" }
      - { kind: burst, art: "proc:spark", count: [30, 56], speed: [180, 420], life: 0.55, clock: world, drag: 2.2, spread: 200, size: [1.5, 2.4] }
      - { kind: ring, color: "#fff0c8", radius: [110, 170], life: 0.32, clock: world, width: [4, 8] }
      - { kind: shake, trauma: [0.4, 0.62] }
      - { kind: distortion, radius: [110, 180], life: 0.35, clock: song, strength: [0.6, 1] }
      - { kind: aberration, strength: [0.4, 1], life: 0.18 }
      - { kind: flash, opacity: [0.06, 0.14], life: 0.1, color: "#fff4d0" }
      - { kind: light, color: "#ffe0a0", radius: [150, 240], life: 0.28, clock: song, strength: [1.4, 2] }
      - { kind: decal, art: "proc:scorch", size: [1, 1.6] }
  - id: hit-spin
    layers:
      - { kind: ring, color: "#e8f4ff", radius: [56, 70], life: 0.22, clock: world, width: [4, 8] }
      - { kind: burst, art: "proc:spark", count: [8, 18], speed: [90, 220], life: 0.35, clock: world, drag: 3 }
      - { kind: shake, trauma: [0.06, 0.14] }
      - { kind: light, color: "#c8dcff", radius: [60, 100], life: 0.2, clock: song }
  - id: hit-dash
    layers:
      - { kind: sprite, art: "proc:streak", clock: world, life: 0.22, align: hitShape, additive: true, tint: "#d8f0ff" }
      - { kind: burst, art: "proc:spark", count: [10, 20], speed: [100, 240], life: 0.35, clock: world, drag: 3 }
      - { kind: shake, trauma: [0.14, 0.28] }
      - { kind: light, color: "#d0e8ff", radius: [60, 100], life: 0.15, clock: song }
  - id: hit-sweep
    layers:
      - { kind: sprite, art: "proc:cross", clock: world, life: 0.18, additive: true, tint: "#ffe8b0" }
      - { kind: burst, art: "proc:spark", count: [6, 10], speed: [80, 180], life: 0.3, clock: world, drag: 3 }
      - { kind: shake, trauma: [0.08, 0.12] }
  - id: hit-burst
    layers:
      - { kind: ring, color: "#c8a0ff", radius: [130, 150], life: 0.45, clock: world, width: [6, 10] }
      - { kind: sprite, art: "fx:spell-burst", clock: world, life: 0.6, scale: [1.5, 2.2], additive: true }
      - { kind: burst, art: "proc:glow", count: [16, 30], speed: [60, 200], life: 0.8, clock: world, drag: 1.5, tint: "#d8b8ff" }
      - { kind: distortion, radius: [120, 180], life: 0.45, clock: song, strength: [0.6, 1] }
      - { kind: shake, trauma: [0.25, 0.45] }
      - { kind: light, color: "#c8a0ff", radius: [140, 220], life: 0.4, clock: song, strength: [1.2, 1.8] }
  - id: death-humanoid
    layers:
      - { kind: burst, art: "proc:shard", count: [5, 10], speed: [120, 280], spread: 140, life: 0.7, clock: world, gravity: 380, tint: debris, additive: false }
      - { kind: burst, art: "proc:gib", count: [2, 4], speed: [110, 240], spread: 140, life: 0.9, clock: world, gravity: 420, tint: debris, additive: false }
      - { kind: sprite, art: "proc:wisp", clock: world, life: 0.9, align: up, additive: true, tint: "#d8f0ff" }
      - { kind: decal, art: "proc:splat", tint: debris, size: [0.7, 1.2] }
  - id: death-elite
    layers:
      - { kind: burst, art: "proc:shard", count: [12, 20], speed: [140, 320], spread: 140, life: 0.8, clock: world, gravity: 380, tint: debris, additive: false }
      - { kind: burst, art: "proc:gib", count: [4, 7], speed: [120, 280], spread: 140, life: 1.0, clock: world, gravity: 420, tint: debris, additive: false }
      - { kind: sprite, art: "fx:explosion-small", clock: world, life: 0.5, additive: true }
      - { kind: sprite, art: "proc:wisp", clock: world, life: 1.0, align: up, additive: true, tint: "#ffe8b0" }
      - { kind: decal, art: "proc:splat", tint: debris, size: [1.2, 1.6] }
      - { kind: shake, trauma: [0.1, 0.2] }
  - id: death-slime
    layers:
      - { kind: burst, art: "proc:drop", count: [6, 12], speed: [120, 270], spread: 140, life: 0.6, clock: world, gravity: 420, tint: debris, additive: false }
      - { kind: sprite, art: "proc:wisp", clock: world, life: 0.7, align: up, additive: true, tint: "#d0ffb0" }
      - { kind: decal, art: "proc:splat", tint: debris, size: [0.8, 1.2] }
  - id: death-flyer
    layers:
      - { kind: burst, art: "proc:shard", count: [4, 8], speed: [110, 250], spread: 140, life: 0.6, clock: world, gravity: 300, tint: debris, additive: false }
      - { kind: burst, art: "proc:spark", count: [4, 8], speed: [40, 100], life: 0.5, clock: world, drag: 2, tint: "#fff0d0" }
      - { kind: sprite, art: "proc:wisp", clock: world, life: 0.7, align: up, additive: true, tint: "#f0e0ff" }
  - id: death-skeleton
    layers:
      - { kind: burst, art: "proc:bone", count: [5, 9], speed: [130, 290], spread: 140, life: 0.8, clock: world, gravity: 420, tint: debris, additive: false }
      - { kind: sprite, art: "proc:wisp", clock: world, life: 0.9, align: up, additive: true, tint: "#c8f0ff" }
      - { kind: decal, art: "proc:dust", tint: "#a89880", size: [0.8, 1.1] }
  - id: death-ember
    layers:
      - { kind: burst, art: "proc:bone", count: [5, 9], speed: [130, 290], spread: 140, life: 0.8, clock: world, gravity: 420, tint: debris, additive: false }
      - { kind: burst, art: "proc:ember", count: [6, 12], speed: [30, 90], life: 1.0, clock: world, gravity: -60, tint: "#ffa040" }
      - { kind: sprite, art: "fx:explosion-small", clock: world, life: 0.45, additive: true, scale: 0.8 }
      - { kind: decal, art: "proc:scorch", size: [0.7, 1.0] }
      - { kind: light, color: "#ff8a3a", radius: [40, 70], life: 0.3, clock: world }
  - id: death-boss
    layers:
      - { kind: sprite, art: "fx:explosion-big", clock: world, life: 0.9, additive: true, scale: 2.5 }
      - { kind: burst, art: "proc:gib", count: [20, 30], speed: [100, 300], life: 1.4, clock: world, gravity: 380, tint: debris, additive: false }
      - { kind: burst, art: "proc:ember", count: [30, 50], speed: [40, 200], life: 1.8, clock: world, gravity: -40, tint: "#ffc060" }
      - { kind: ring, color: "#fff0c8", radius: [220, 280], life: 0.7, clock: world, width: [8, 12] }
      - { kind: flash, opacity: [0.3, 0.4], life: 0.25 }
      - { kind: shake, trauma: [0.8, 1.0] }
      - { kind: distortion, radius: [240, 320], life: 0.7, clock: song, strength: 1 }
      - { kind: decal, art: "proc:scorch", size: [3, 3.5] }
      - { kind: light, color: "#ffd080", radius: [300, 400], life: 0.8, clock: song, strength: 2 }
  - id: blades-hit
    layers:
      - { kind: burst, art: "proc:spark", count: [3, 6], speed: [60, 150], life: 0.25, clock: world, drag: 3, tint: "#d8f4ff" }
      - { kind: light, color: "#bfe8ff", radius: [24, 40], life: 0.1, clock: song }
  - id: lightning-hit
    layers:
      - { kind: burst, art: "proc:spark", count: [6, 12], speed: [80, 220], life: 0.3, clock: world, drag: 3, tint: "#c8e0ff" }
      - { kind: light, color: "#a8c8ff", radius: [60, 100], life: 0.15, clock: song, strength: 1.5 }
      - { kind: shake, trauma: [0.05, 0.1] }
      - { kind: decal, art: "proc:scorch", size: [0.5, 0.7] }
  - id: fire-hit
    layers:
      - { kind: burst, art: "proc:ember", count: [3, 7], speed: [20, 70], life: 0.7, clock: world, gravity: -80, tint: "#ff9a40" }
      - { kind: light, color: "#ff8a3a", radius: [30, 50], life: 0.2, clock: world }
  - id: blast-hit
    layers:
      - { kind: burst, art: "proc:ember", count: [2, 4], speed: [40, 120], life: 1.2, clock: world, gravity: -30, tint: "#fff0c0" }
  - id: finale-blast
    layers:
      - { kind: ring, color: "#fff8e0", radius: 900, life: 0.5, clock: song, width: 26 }
      - { kind: ring, color: "#ffc860", radius: 820, life: 0.6, clock: song, width: 12 }
      - { kind: flash, opacity: 0.4, life: 0.5 }
      - { kind: shake, trauma: 1 }
      - { kind: distortion, radius: 700, life: 0.6, clock: song, strength: 1 }
      - { kind: aberration, strength: 1, life: 0.4 }
      - { kind: light, color: "#fff2c0", radius: 900, life: 1.2, clock: song, strength: 2 }
  - id: level-up
    layers:
      - { kind: ring, color: "#ffe890", radius: 220, life: 0.6, clock: song, width: 10 }
      - { kind: burst, art: "proc:glow", count: 36, speed: [120, 260], life: 0.9, clock: song, drag: 1.5, tint: "#fff0a0" }
      - { kind: flash, opacity: 0.3, life: 0.3, color: "#fff8d0" }
      - { kind: distortion, radius: 240, life: 0.6, clock: song, strength: 1 }
      - { kind: light, color: "#fff0a0", radius: 260, life: 0.8, clock: song, strength: 2 }
      - { kind: text, text: "LEVEL UP!", color: "#ffe060", life: 1.4, size: 28 }
      - { kind: shake, trauma: 0.4 }
  - id: near-miss
    layers:
      - { kind: ring, color: "#a0f0ff", radius: 40, life: 0.35, clock: song, width: 3 }
      - { kind: burst, art: "proc:spark", count: 12, speed: [90, 160], life: 0.35, clock: song, drag: 2, tint: "#c8f8ff" }
      - { kind: text, text: "PERFECT", color: "#80f0ff", life: 0.9, size: 18 }
  - id: dodge
    layers:
      - { kind: burst, art: "proc:dust", count: [4, 7], speed: [20, 60], life: 0.45, clock: world, drag: 2, additive: false, tint: "#c8b8a0" }
  - id: dust
    layers:
      - { kind: burst, art: "proc:dust", count: [3, 6], speed: [15, 45], life: 0.4, clock: world, spread: 180, drag: 2, additive: false, tint: "#b8a890" }
  # A stomp: both feet stamp, with a ring of dust.
  - id: stomp
    layers:
      - { kind: ring, color: "#c8b8a0", radius: 30, life: 0.3, clock: world, width: 3 }
      - { kind: burst, art: "proc:dust", count: [8, 12], speed: [30, 70], life: 0.45, clock: world, drag: 2, additive: false, tint: "#b8a890" }
  - id: perfect-accent
    layers:
      - { kind: text, text: "PERFECT", color: "#ffe060", life: 0.8, size: 18 }
  - id: boss-land
    layers:
      - { kind: ring, color: "#ffd8a0", radius: 260, life: 0.6, clock: world, width: 10 }
      - { kind: burst, art: "proc:dust", count: 40, speed: [80, 260], life: 0.9, clock: world, drag: 2, additive: false, tint: "#8a6a4a" }
      - { kind: shake, trauma: 0.9 }
      - { kind: distortion, radius: 260, life: 0.6, clock: song, strength: 1 }
      - { kind: decal, art: "proc:crack", size: 3 }
      - { kind: flash, opacity: 0.25, life: 0.2 }
  - id: boss-slam
    layers:
      - { kind: ring, color: "#ff8060", radius: 90, life: 0.4, clock: world, width: 8 }
      - { kind: burst, art: "proc:dust", count: 24, speed: [80, 220], life: 0.7, clock: world, drag: 2, additive: false, tint: "#7a5a3a" }
      - { kind: burst, art: "proc:ember", count: 16, speed: [60, 180], life: 0.8, clock: world, gravity: -40, tint: "#ffa060" }
      - { kind: shake, trauma: 0.7 }
      - { kind: distortion, radius: 160, life: 0.45, clock: song, strength: 1 }
      - { kind: decal, art: "proc:crack", size: 1.6 }
      - { kind: light, color: "#ff8a3a", radius: 140, life: 0.3, clock: song, strength: 1.5 }
  - id: shockwave
    layers:
      - { kind: sprite, art: "proc:arc", clock: world, life: 0.22, align: hitShape, additive: true, tint: "#ffd890", scale: 1 }
      - { kind: burst, art: "proc:spark", count: [4, 8], speed: [60, 140], life: 0.3, clock: world, drag: 3, tint: "#ffe8b0" }
      - { kind: shake, trauma: [0.05, 0.1] }
  - id: arrow-shatter
    layers:
      - { kind: burst, art: "proc:spark", count: 10, speed: [60, 160], life: 0.3, clock: world, drag: 3, tint: "#fff0c0" }
      - { kind: burst, art: "proc:shard", count: 3, speed: [40, 100], life: 0.5, clock: world, gravity: 300, tint: "#c8a070", additive: false }
  - id: arrow-release
    layers:
      - { kind: burst, art: "proc:spark", count: 4, speed: [30, 80], life: 0.2, clock: world, tint: "#fff0c0" }
  - id: gem-pickup
    layers:
      - { kind: burst, art: "proc:glow", count: [4, 10], speed: [30, 90], life: 0.35, clock: song, drag: 2, tint: "#80ffd0" }
  - id: accent-flash
    layers:
      - { kind: flash, opacity: [0.2, 0.4], life: 0.18 }
