# Hero moves. Animations name baked hero animations in public/assets/characters.json.
moves:
  - id: slash
    animation: { name: slash, fps: 16 }
    hitShape: { kind: arc, radius: 56, degrees: 120 }
    weight: light
    travel: 6
  - id: backslash
    animation: { name: backslash, fps: 16 }
    hitShape: { kind: arc, radius: 56, degrees: 120 }
    weight: light
    travel: 6
  - id: halfslash
    animation: { name: halfslash, fps: 16 }
    hitShape: { kind: arc, radius: 56, degrees: 120 }
    weight: light
    travel: 4
  - id: thrust
    animation: { name: thrust, fps: 16 }
    hitShape: { kind: line, length: 72, width: 24 }
    weight: light
    travel: 10
  - id: spin
    animation: { name: slash, fps: 14, cycleFacings: true }
    hitShape: { kind: circle, radius: 64 }
    weight: medium
    effect: hit-spin
  - id: cleave
    animation: { name: slash-oversize, fps: 14 }
    hitShape: { kind: arc, radius: 80, degrees: 160 }
    weight: heavy
    hitStopMs: 110
    travel: 8
  - id: dash-strike
    animation: { name: thrust, fps: 18 }
    hitShape: { kind: capsule, length: [96, 160], radius: 22 }
    weight: medium
    travel: 128
    effect: hit-dash
  - id: sweep
    animation: { name: halfslash, fps: 18 }
    hitShape: { kind: sweep, radius: 22 }
    weight: medium
    effect: hit-sweep
  - id: burst
    animation: { name: spellcast, fps: 14 }
    hitShape: { kind: circle, radius: 140 }
    weight: heavy
    hitStopMs: 130
    effect: hit-burst
    sound: burst
  - id: finisher
    animation: { name: slash-oversize, fps: 14 }
    hitShape: { kind: circle, radius: 140 }
    weight: heavy
    hitStopMs: 150
    effect: hit-heavy
    extraEffect: hit-burst
    sound: finisher
  - id: dodge
    animation: { name: jump, fps: 18 }
    weight: light
    travel: 40
    dodge: true
    effect: dodge
    sound: dodge
