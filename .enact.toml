# Enact configuration. See /Users/dthurn/enact/README.md.
remote = "origin"
staging_branch = "staging"
master_branch = "master"

[checks]
fast = "scripts/check-fast"
# One persistent target directory: the slow-CI runner is serialized by its lock.
slow = 'CARGO_TARGET_DIR="$HOME/Library/Caches/playlist-survivors/target-release" scripts/ci-full'

[worktree]
root = ".worktrees"   # inside the checkout; gitignored
# APFS-clone a warm Cargo target into each new worktree (scripts/enact-worktree). Enact runs
# hooks in the main checkout, which trails staging until slow CI passes, so create runs the
# script at the new worktree's base and remove the worktree's own copy.
create = 'f=$(mktemp) && git -C "$ENACT_REPO" show "$ENACT_BASE_SHA:scripts/enact-worktree" > "$f" && sh "$f" create; s=$?; rm -f "$f"; exit $s'
remove = 'f="$ENACT_WORKTREE_PATH/scripts/enact-worktree"; [ -f "$f" ] || f="$ENACT_REPO/scripts/enact-worktree"; sh "$f" remove'

