[package]
name = "app"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "playlist-survivors"
path = "src/main.rs"

[dependencies]
analysis = { path = "../analysis" }
libc = "0.2"
objc2 = "0.6"
objc2-audio-toolbox = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSValue", "NSString", "NSDictionary", "NSUUID", "NSEnumerator", "NSObject"] }
pollster = "1"
render = { path = "../render" }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[lints]
workspace = true
