[package]
name = "plugin"
version = "0.0.0"
edition.workspace = true
publish = false

# libps_plugin.dylib for Unity, and an rlib for the tests that drive its C interface.
[lib]
name = "ps_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
analysis = { path = "../analysis" }
audio = { path = "../audio" }
capture = { path = "../capture" }
rtrb = "0.4"
serde_json = "1"
stream = { path = "../stream" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"

[lints]
workspace = true
