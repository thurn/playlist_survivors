# check:reactive's compressed director (docs/design/reactive-audio.md, "Cuts"): every rule of the
# reactive level made small enough that each feature fires within the ~45 s causality-mix track, so
# the causality check exercises it. Check-only: the game never plays it.
extends: reactive
director:
  population: { start: 40, perMinute: 120, max: 480, levelScale: { quiet: 0.6, medium: 1.0, loud: 1.3 } }
  sections:
    - { slime: 2, bat: 1 }
    - { goblin: 3, slime: 2, bat: 1 }
    - { goblin: 3, orc: 2, skeleton: 1, orc-elite: 0.03 }
    - { orc-ember: 3, skeleton-ember: 2, goblin: 2, orc-elite: 0.03 }
  sectionRule: { jumpDb: 6, minGapS: 4 }
  levelUps: [{ xp: 5 }, { xp: 10 }, { xp: 15 }]
  levelUpWaitS: 4
  zoneFallbackS: 12
  smoothS: 2
  camera:
    quiet: { zoom: 1.3, lead: 30 }
    medium: { zoom: 1.2, lead: 50 }
    loud: { zoom: 1.05, lead: 60 }
  palettes: { quiet: soft-chimes, medium: crisp-steel, loud: heavy-infernal }
  paletteHoldS: 2
  calm: { quiet: 0.5, medium: 0, loud: 0 }
  setPieces:
    gapS: 2
    stampede: { enemy: goblin, count: 20, rows: 2, jumpDb: 6, quietS: 3 }
    ring: { enemy: goblin, count: 20, gaps: 3, afterS: 1, maxBeats: 6 }
    volleys: { archers: 2, everyBeats: 4 }
    wedge: bee-wedge
    kickLine: { formation: skeleton-kick-line, mediumBeats: 4, minDanceBeats: 4, maxDanceBeats: 8 }
    boss: { type: minotaur, afterS: 45, landAfterS: 0.6, slamBeats: 4, retreatS: 4, landmark: standing-stones }
    finale: { blast: finale-blast, landmark: ruined-shrine, windowS: 10, swell: 0.4, swellS: 1.5, epilogueS: 3 }
