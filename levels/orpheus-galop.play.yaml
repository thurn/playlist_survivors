# Play mode's tuning for the Can-Can level: the demo's level script with only
# the differences restated. See docs/design/interactive.md.
extends: orpheus-galop
world: open                 # the demo's default is corridor
# Press classes replace one rated press per grid slot: every press is classed against the grid,
# and the groove meter fills, drains and sets the tier. Every weapon fires by itself (selfFiring):
# the sword on every grid time, and the tier sets attack area and damage. Every gameplay sound plays
# on its subdivision's slot, never late (gridSounds). An eligible accent's swing is heavy for everyone,
# and a press on the chord launches its shockwave (pressCleaves). The steady stream aims for 60% of
# the population curve, and set pieces (the closing rings and stampedes below) bring the rest (setPieces).
# Gems wait where they drop, collected inside a pickup radius that grows with the tier, and a vacuum
# follows each set piece (fieldGems).
rules: { oneStepPerSlot: false, accentTelegraphs: true, health: true, strides: true, pressClasses: true, selfFiring: true, gridSounds: true, pressCleaves: true, setPieces: true, fieldGems: true, upgradePool: true, upgradeOrbs: true, healthPool: true }
hero:
  # Fixed-speed strides: 140 px/s at any tempo and press rate, faster than every enemy but bats and bees.
  walk: { speed: 140 }
  timing: { perfectMs: 45, greatMs: 90, goodMs: 140, floor: 0.1 }
  # A loosely timed press swings short: 55% of the arc's reach at the timing floor, full at Perfect.
  swings: { light: { minReach: 0.55 } }
  # The small health pool (rules.healthPool): 100, invulnerable for 0.5 s after a bite, 20 from a level-up.
  health: { max: 100, invulnerableMs: 500, levelUpHeal: 20 }
# Play mode's damage: an arrow takes 15 (the boss's slam keeps its 25).
enemies: { skeleton-archer: { attackDamage: 15 } }
# The upgrade pool (rules.upgradePool): the run starts with the blades and lightning beside the
# sword, and the fire trail is one of the weapon upgrades a level-up can offer.
upgrades: { loadout: [orbiting-blades, chain-lightning], offer: [fire-trail] }
player: moderate            # the bot used for ?start= and for checks
sections:
  # The prelude plays at full speed: a slowed world makes walking feel like wading. The music's
  # calm goes to the enemies instead, which drift in slowly on a spiral. The sword swings by
  # itself on every beat, twice the demo's rate, so the calm stretch still clears enemies.
  - section: prelude
    timeScale: 1
    calm: 0.5
    autoSwingBeats: 1
  # The galop starts in the woods: the first transform wave sweeps out on its first downbeat,
  # right after the count-in.
  - section: galop-vamp
    zone: galop-woods
  - section: climax
    camera: { lead: 0 }
# Level-ups offer three items from the upgrade pool (rules.upgradePool). Experience for each: the
# moderate player fills each bar a little before its moment (with gems on the field it collects
# them only where it walks: about 110-125 by the first, 540-740 between the first and second, and
# 870-1250 between the second and third on the checked seeds).
events:
  - at: { section: galop-opening, point: start }
    levelUp: offer
    xp: 100
  - at: { section: theme-a-repeat, point: start }
    levelUp: offer
    xp: 470
  - at: { section: bridge, point: start }
    levelUp: offer
    xp: 800
  # Set pieces (rules.setPieces): closing rings around where the hero stands, each closing on an
  # accent a cleave can meet, and stampedes running across the view.
  - at: { accent: tutti-chord, fromEnd: 6 }           # 0:59.5
    ring: { enemy: goblin, count: 30, gaps: 3, closesOn: { accent: tutti-chord, fromEnd: 5 } }   # 1:02.3
  - at: { bar: 104, beat: 1 }                         # 1:42.0, after the bridge's level-up
    stampede: { enemy: goblin, count: 40, rows: 2 }
  - at: { bar: 118, beat: 2 }                         # 1:51.2
    ring: { enemy: goblin, count: 60, gaps: 3, closesOn: { bar: 126, beat: 2 } }                 # 1:56.2
  - at: { section: coda, point: start }               # 2:04.6
    stampede: { enemy: goblin, count: 60, rows: 3 }
  - at: { bar: 147, beat: 1 }                         # 2:08.8
    ring: { enemy: goblin, count: 80, gaps: 3, closesOn: { bar: 154, beat: 2 } }                 # 2:13.0
