# The showcase (`--showcase`, epic ps-8sb): demo2d's song, *Action* (3:19), played start to end
# with nobody at the keys. It starts as levels/survivors.yaml trimmed to the song: its first four
# minutes. The finale follows the song's confirmed end, not the run clock, and the hero never falls
# (hits still land and show).
song: reactive
seed: 2026
player: reactive-moderate
reactive: true
survivors:
  durationS: 240
  endsWithSong: true
  heroStands: true
  contactDamage: 0.5
  bruteChickenChance: 0.05
  bossChickens: 1
  maxedHeal: 30
  # Each row = same minute in appendix-damage-vs-health.md, The Mad Forest schedule.
  # Events/treasure: appendix-feel.md; executed later by SW6/SH10.
  # frequency is milliseconds. Duplicate roster entries are intentional. No Reaper.
  schedule:
    - {"minute":0,"minimum":15,"frequency":1000,"enemies":["vs-bat3"],"bosses":[],"events":[],"treasure":[]}
    - {"minute":1,"minimum":30,"frequency":1000,"enemies":["vs-zombie","vs-bat1"],"bosses":["vs-bat4"],"events":[],"treasure":[{"chances":[0,0,30],"level":1,"prizeTypes":"EAAAA","fixedPrizes":["AMOUNT"]}]}
    - {"minute":2,"minimum":50,"frequency":500,"enemies":["vs-bat1","vs-bat2","vs-bat3"],"bosses":[],"events":[{"kind":"BAT_SWARM","delayMs":5000,"extraRepeats":2,"durationMs":10000,"count":50}],"treasure":[]}
    - {"minute":3,"minimum":40,"frequency":250,"enemies":["vs-skeleton"],"bosses":["vs-bat4"],"events":[{"kind":"BAT_SWARM","delayMs":5000,"extraRepeats":1,"chance":10,"durationMs":10000,"count":50}],"treasure":[{"chances":[0,5,40],"level":1,"prizeTypes":"WAAAA","fixedPrizes":[]}]}
hero: { health: { max: 120, invulnerableMs: 120 } }
upgrades: { loadout: [], offer: [] }
zones: [twilight-glade, galop-woods, mushroom-grove, ember-hollow, infernal-grove]
sections:
  - section: reactive
    bars: all
    pace: 50
    presses: "xx"
    zone: twilight-glade
    camera: { zoom: 1.2, lead: 50, punchOnAccents: false }
    sfxPalette: crisp-steel
director:
  population: { start: 0, perMinute: 0, max: 300, levelScale: { quiet: 0.6, medium: 1.0, loud: 1.3 } }
  sections:
    - { slime: 2, bat: 1 }
    - { goblin: 2, slime: 2, bat: 1 }
    - { goblin: 3, orc: 1, slime: 1, bat: 1 }
    - { goblin: 3, orc: 2, skeleton: 1, orc-elite: 0.01 }
    - { goblin: 2, orc: 2, skeleton: 2, orc-ember: 1, orc-elite: 0.01 }
    - { orc-ember: 3, skeleton-ember: 2, goblin: 2, orc-elite: 0.01 }
  sectionRule: { jumpDb: 6, minGapS: 8 }
  levelUps: []
  levelUpWaitS: 20
  zoneFallbackS: 240
  smoothS: 2
  camera:
    quiet: { zoom: 1.3, lead: 30 }
    medium: { zoom: 1.2, lead: 50 }
    loud: { zoom: 1.05, lead: 60 }
  palettes: { quiet: soft-chimes, medium: crisp-steel, loud: heavy-infernal }
  paletteHoldS: 2
  calm: { quiet: 0.5, medium: 0, loud: 0 }
  setPieces:
    gapS: 6
    stampede: { enemy: goblin, count: 40, rows: 2, jumpDb: 6, quietS: 8 }
    ring: { enemy: goblin, count: 40, gaps: 3, afterS: 3, maxBeats: 12 }
    volleys: { archers: 2, everyBeats: 4 }
    wedge: bee-wedge
    kickLine: { formation: skeleton-kick-line, mediumBeats: 16, minDanceBeats: 8, maxDanceBeats: 32 }
    boss: { type: minotaur, afterS: 90, landAfterS: 0.6, slamBeats: 8, retreatS: 90, landmark: standing-stones }
    finale: { blast: finale-blast, landmark: ruined-shrine, windowS: 10, swell: 0.4, swellS: 1.5, epilogueS: 3 }
