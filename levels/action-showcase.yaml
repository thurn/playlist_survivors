# The showcase (`--showcase`, epic ps-8sb): demo2d's song, *Action* (3:19), played start to end
# with nobody at the keys, at demo2d's crowd and framing (evidence: native/evidence/showcase/density).
# The finale follows the song's confirmed end, not the run clock, and the hero never falls (hits
# still land and show).
song: reactive
seed: 2026
player: reactive-moderate
reactive: true
survivors:
  durationS: 240
  endsWithSong: true
  heroStands: true
  cap: 1000
  contactDamage: 0.5
  bruteChickenChance: 0.05
  bossChickens: 1
  maxedHeal: 30
  # demo2d's crowd curve (demo2d/Assets/Demo2D/Data/action-level.json), one row per section of
  # songs/action/songmap.json. songS is the section's start on the run's song clock: the song
  # map's time less the run's start (song 7.0 s, native's auto-start), so a level-up's freeze never
  # shifts a row. minimum is the crowd ON SCREEN, demo2d's onScreen x 400 (the spawner steers a
  # crowd round the view toward it; `--showcase-density` measures it); widen is demo2d's
  # viewWidthM / 30 m, eased in over 2 s. cap: the most alive at once (the final peak holds ~950).
  # demo2d's mixes onto native kinds of a similar role (frequency is milliseconds; duplicates
  # weight the mix, elites spread through it):
  #   grunts: skeleton > vs-skeleton, ghoul > vs-zombie, flame-imp > vs-bat3, ice-skull > vs-ghost,
  #           mask > vs-bat2, zombie-warrior > vs-mudman1
  #   casters (native has no ranged survivors kind): skeleton-mage, blood-mage > vs-xlbat
  #   elites: ogre > vs-mudman2, cyclops > vs-xlmantis, werewolf > vs-werewolf,
  #           lava-beast > vs-xlmummy
  #   boss: boss-devil > vs-boss-xlmantis at the final peak
  # The chests ride on vs-bat4 at drop-1 and groove-2, as the Mad Forest's minutes 1 and 3 did.
  schedule:
    # intro: demo2d 3 on screen
    - {"minute":0,"songS":0,"widen":1.0,"minimum":3,"frequency":250,"enemies":["vs-skeleton"],"bosses":[],"events":[],"treasure":[]}
    # groove: demo2d 60 on screen
    - {"minute":1,"songS":5.4,"widen":1.0,"minimum":60,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-bat3","vs-skeleton","vs-zombie","vs-zombie","vs-zombie"],"bosses":[],"events":[],"treasure":[]}
    # break-1: demo2d 60 on screen
    - {"minute":2,"songS":27.07,"widen":1.0,"minimum":60,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-bat3","vs-skeleton","vs-zombie","vs-zombie","vs-zombie"],"bosses":[],"events":[],"treasure":[]}
    # drop-1: demo2d 160 on screen
    - {"minute":3,"songS":30.17,"widen":1.0667,"minimum":160,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-ghost","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-xlbat","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-ghost","vs-zombie","vs-zombie","vs-bat3","vs-bat3","vs-bat3","vs-bat3"],"bosses":["vs-bat4"],"events":[],"treasure":[{"chances":[0,0,30],"level":1,"prizeTypes":"EAAAA","fixedPrizes":["AMOUNT"]}]}
    # breakdown: demo2d 120 on screen
    - {"minute":4,"songS":67.33,"widen":1.0,"minimum":120,"frequency":250,"enemies":["vs-skeleton","vs-bat2","vs-skeleton","vs-bat2","vs-skeleton","vs-ghost","vs-ghost"],"bosses":[],"events":[],"treasure":[]}
    # groove-2: demo2d 200 on screen
    - {"minute":5,"songS":79.72,"widen":1.1333,"minimum":200,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-xlbat","vs-skeleton","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-bat2","vs-mudman2","vs-bat2","vs-bat2","vs-bat2","vs-bat2","vs-mudman1","vs-mudman1","vs-mudman1","vs-mudman1","vs-mudman1"],"bosses":["vs-bat4"],"events":[],"treasure":[{"chances":[0,5,40],"level":1,"prizeTypes":"WAAAA","fixedPrizes":[]}]}
    # build: demo2d 200 on screen
    - {"minute":6,"songS":104.49,"widen":1.1333,"minimum":200,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-xlbat","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-xlmantis","vs-bat3","vs-bat3","vs-bat3","vs-bat3","vs-bat3","vs-mudman1","vs-mudman1","vs-mudman1","vs-mudman1","vs-mudman1"],"bosses":[],"events":[],"treasure":[]}
    # break-2: demo2d 160 on screen
    - {"minute":7,"songS":113.78,"widen":1.1333,"minimum":160,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-bat3","vs-skeleton","vs-zombie","vs-bat3","vs-zombie","vs-zombie","vs-mudman1","vs-mudman1"],"bosses":[],"events":[],"treasure":[]}
    # drop-2: demo2d 320 on screen
    - {"minute":8,"songS":116.88,"widen":1.2,"minimum":320,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-xlbat","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-mudman2","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-werewolf","vs-zombie","vs-zombie","vs-zombie","vs-bat3","vs-bat3","vs-xlbat","vs-bat3","vs-bat3","vs-bat3","vs-mudman1","vs-mudman1","vs-xlmummy","vs-mudman1","vs-mudman1","vs-mudman1","vs-ghost","vs-ghost","vs-ghost"],"bosses":[],"events":[],"treasure":[]}
    # final-peak: demo2d 384 on screen
    - {"minute":9,"songS":154.04,"widen":1.35,"minimum":384,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-xlbat","vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-mudman2","vs-skeleton","vs-skeleton","vs-zombie","vs-zombie","vs-xlmantis","vs-zombie","vs-zombie","vs-zombie","vs-zombie","vs-xlbat","vs-zombie","vs-zombie","vs-bat3","vs-bat3","vs-werewolf","vs-bat3","vs-bat3","vs-bat3","vs-mudman1","vs-xlmummy","vs-mudman1","vs-mudman1","vs-mudman1","vs-mudman1","vs-ghost","vs-ghost","vs-ghost","vs-bat2","vs-bat2","vs-bat2"],"bosses":["vs-boss-xlmantis"],"events":[],"treasure":[]}
    # outro: demo2d 200 on screen
    - {"minute":10,"songS":178.82,"widen":1.2,"minimum":200,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-zombie","vs-zombie","vs-zombie","vs-mudman1","vs-mudman1"],"bosses":[],"events":[],"treasure":[]}
    # ending: demo2d 100 on screen
    - {"minute":11,"songS":188.11,"widen":1.1,"minimum":100,"frequency":250,"enemies":["vs-skeleton","vs-skeleton","vs-skeleton","vs-skeleton","vs-zombie","vs-zombie","vs-zombie"],"bosses":[],"events":[],"treasure":[]}
hero: { health: { max: 120, invulnerableMs: 120 } }
upgrades: { loadout: [], offer: [] }
zones: [twilight-glade, galop-woods, mushroom-grove, ember-hollow, infernal-grove]
sections:
  - section: reactive
    bars: all
    pace: 50
    presses: "xx"
    zone: twilight-glade
    camera: { zoom: 1.2, lead: 50, punchOnAccents: false }
    sfxPalette: crisp-steel
director:
  population: { start: 0, perMinute: 0, max: 300, levelScale: { quiet: 1.0, medium: 1.0, loud: 1.0 } }
  sections:
    - { slime: 2, bat: 1 }
    - { goblin: 2, slime: 2, bat: 1 }
    - { goblin: 3, orc: 1, slime: 1, bat: 1 }
    - { goblin: 3, orc: 2, skeleton: 1, orc-elite: 0.01 }
    - { goblin: 2, orc: 2, skeleton: 2, orc-ember: 1, orc-elite: 0.01 }
    - { orc-ember: 3, skeleton-ember: 2, goblin: 2, orc-elite: 0.01 }
  sectionRule: { jumpDb: 6, minGapS: 8 }
  levelUps: []
  levelUpWaitS: 20
  zoneFallbackS: 240
  smoothS: 2
  # One zoom at every loudness: the showcase frames by demo2d's view widths (the schedule's
  # widen), not by native's loudness camera.
  camera:
    quiet: { zoom: 1.2, lead: 30 }
    medium: { zoom: 1.2, lead: 50 }
    loud: { zoom: 1.2, lead: 60 }
  palettes: { quiet: soft-chimes, medium: crisp-steel, loud: heavy-infernal }
  paletteHoldS: 2
  calm: { quiet: 0.5, medium: 0, loud: 0 }
  setPieces:
    gapS: 6
    stampede: { enemy: goblin, count: 40, rows: 2, jumpDb: 6, quietS: 8 }
    ring: { enemy: goblin, count: 40, gaps: 3, afterS: 3, maxBeats: 12 }
    volleys: { archers: 2, everyBeats: 4 }
    wedge: bee-wedge
    kickLine: { formation: skeleton-kick-line, mediumBeats: 16, minDanceBeats: 8, maxDanceBeats: 32 }
    boss: { type: minotaur, afterS: 90, landAfterS: 0.6, slamBeats: 8, retreatS: 90, landmark: standing-stones }
    finale: { blast: finale-blast, landmark: ruined-shrine, windowS: 10, swell: 0.4, swellS: 1.5, epilogueS: 3 }
