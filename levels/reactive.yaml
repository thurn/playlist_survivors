# Reactive mode's level (docs/design/reactive-audio.md, "The reactive level"): one section over the
# reactive song map that a track's belief stream builds (committed beats in 2-beat bars), and a
# director in place of the song map's sections. Stage 1: no level-script events, accent punches,
# cleaves, set pieces, finale blast or time-scale changes; later stages add them below.
song: reactive
seed: 2026
player: reactive-moderate
reactive: true
# The difficulty curve (stage 7, tuned on the Galop over two seeds): the honest reactive players
# (reactive-moderate, reactive-human, reactive-skilled) live, at 37–77% lowest health, and the holder
# and mashers fall at 1:52–2:07, as play mode's curve has them fall in the climax. The hero has
# twice play mode's health and the horde grows from nothing at 240 a minute, so a high tier keeps
# it down and tier 0 bleeds; orc elites are rare (1%), so chickens (30 health each) are too; the
# boss slams every 8 beats, since its slams land on everyone alike. Beatless stretches fill the
# meter (hv-s4pt.13), so every player is strong there.
hero: { health: { max: 200 } }
upgrades: { loadout: [orbiting-blades, chain-lightning], offer: [fire-trail] }
zones: [twilight-glade, galop-woods, mushroom-grove, ember-hollow, infernal-grove]
sections:
  - section: reactive
    bars: all
    pace: 50
    presses: "xx"
    zone: twilight-glade
    camera: { zoom: 1.2, lead: 50, punchOnAccents: false }
    sfxPalette: crisp-steel
# Stage 4: detected sections (changes and loudness jumps in the stream) sweep in the next zone and
# step the roster; level-ups fall due at the next section start once their experience is reached;
# the loudness level (quiet, medium, loud) scales the population and sets the camera, the calm and
# the sound palette.
director:
  population: { start: 0, perMinute: 240, max: 520, levelScale: { quiet: 0.6, medium: 1.0, loud: 1.3 } }
  sections:
    - { slime: 2, bat: 1 }
    - { goblin: 2, slime: 2, bat: 1 }
    - { goblin: 3, orc: 1, slime: 1, bat: 1 }
    - { goblin: 3, orc: 2, skeleton: 1, orc-elite: 0.01 }
    - { goblin: 2, orc: 2, skeleton: 2, orc-ember: 1, orc-elite: 0.01 }
    - { orc-ember: 3, skeleton-ember: 2, goblin: 2, orc-elite: 0.01 }
  sectionRule: { jumpDb: 6, minGapS: 8 }
  levelUps: [{ xp: 100 }, { xp: 470 }, { xp: 800 }]
  levelUpWaitS: 20
  zoneFallbackS: 60
  smoothS: 2
  camera:
    quiet: { zoom: 1.3, lead: 30 }
    medium: { zoom: 1.2, lead: 50 }
    loud: { zoom: 1.05, lead: 60 }
  palettes: { quiet: soft-chimes, medium: crisp-steel, loud: heavy-infernal }
  paletteHoldS: 2
  calm: { quiet: 0.5, medium: 0, loud: 0 }
  # Stage 6: set pieces triggered by the music, at least 6 s apart; the finale on the first candidate
  # ending in the last 10 s of the audio, or at its end.
  setPieces:
    gapS: 6
    stampede: { enemy: goblin, count: 40, rows: 2, jumpDb: 6, quietS: 8 }
    ring: { enemy: goblin, count: 40, gaps: 3, afterS: 3, maxBeats: 12 }
    volleys: { archers: 2, everyBeats: 4 }
    wedge: bee-wedge
    kickLine: { formation: skeleton-kick-line, mediumBeats: 16, minDanceBeats: 8, maxDanceBeats: 32 }
    boss: { type: minotaur, afterS: 90, landAfterS: 0.6, slamBeats: 8, retreatS: 90, landmark: standing-stones }
    finale: { blast: finale-blast, landmark: ruined-shrine, windowS: 10, swell: 0.4, swellS: 1.5, epilogueS: 3 }
