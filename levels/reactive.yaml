# Reactive mode's level (docs/design/reactive-audio.md, "The reactive level"): one section over the
# reactive song map that a track's belief stream builds (committed beats in 2-beat bars), and a
# director in place of the song map's sections. Stage 1: no level-script events, accent punches,
# cleaves, set pieces, finale blast or time-scale changes. The numbers are starting values to tune.
song: reactive
seed: 2026
player: reactive-moderate
reactive: true
# Stage 1's difficulty, tuned only so that the honest reactive players (reactive-moderate and
# reactive-human) live to the end of every shipped track (hv-s4pt.3): at tier 0 through the long
# unclear stretches (the Galop's prelude, most of Beethoven's Fifth) the hero cannot outpace the
# horde, so it has six times play mode's health and the horde grows from nothing. Stage 7 tunes
# the real curve.
hero: { health: { max: 600 } }
upgrades: { loadout: [orbiting-blades, chain-lightning], offer: [fire-trail] }
zones: [twilight-glade, galop-woods, mushroom-grove, ember-hollow, infernal-grove]
sections:
  - section: reactive
    bars: all
    pace: 50
    presses: "xx"
    zone: twilight-glade
    camera: { zoom: 1.2, lead: 50, punchOnAccents: false }
    sfxPalette: crisp-steel
# Stage 4: detected sections (changes and loudness jumps in the stream) sweep in the next zone and
# step the roster; level-ups fall due at the next section start once their experience is reached;
# the loudness level (quiet, medium, loud) scales the population and sets the camera, the calm and
# the sound palette.
director:
  population: { start: 0, perMinute: 80, max: 360, levelScale: { quiet: 0.6, medium: 1.0, loud: 1.3 } }
  sections:
    - { slime: 2, bat: 1 }
    - { goblin: 2, slime: 2, bat: 1 }
    - { goblin: 3, orc: 1, slime: 1, bat: 1 }
    - { goblin: 3, orc: 2, skeleton: 1, orc-elite: 0.03 }
    - { goblin: 2, orc: 2, skeleton: 2, orc-ember: 1, orc-elite: 0.03 }
    - { orc-ember: 3, skeleton-ember: 2, goblin: 2, orc-elite: 0.03 }
  sectionRule: { jumpDb: 6, minGapS: 8 }
  levelUps: [{ xp: 100 }, { xp: 470 }, { xp: 800 }]
  levelUpWaitS: 20
  zoneFallbackS: 60
  smoothS: 2
  camera:
    quiet: { zoom: 1.3, lead: 30 }
    medium: { zoom: 1.2, lead: 50 }
    loud: { zoom: 1.05, lead: 60 }
  palettes: { quiet: soft-chimes, medium: crisp-steel, loud: heavy-infernal }
  paletteHoldS: 2
  calm: { quiet: 0.5, medium: 0, loud: 0 }
