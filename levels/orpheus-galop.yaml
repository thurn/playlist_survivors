# Level script for the Can-Can level, for play and Watch the demo alike (the demo is the skilled
# virtual player's run). Sections are keyed by song-map section; every musical reference is a
# bar/beat or a named musical moment, never seconds. See docs/design/gameplay-redesign.md.
song: orpheus-galop
seed: 1858
player: skilled            # the virtual player's skill profile; ?player= overrides it
# An arrow takes 15 (the boss's slam keeps its 25).
enemies: { skeleton-archer: { attackDamage: 15 } }
# The upgrade pool: the run starts with the blades and lightning beside the sword, and the fire
# trail is one of the weapon upgrades a level-up can offer.
upgrades: { loadout: [orbiting-blades, chain-lightning], offer: [fire-trail] }
title:
  piece: "Orpheus in the Underworld — Overture"
  composer: "Jacques Offenbach"
  performer: "Musopen archive recording"   # the source credits no performer
zones: [twilight-glade, galop-woods, mushroom-grove, ember-hollow, infernal-grove]

sections:
  - bars: 1-14            # prelude — slow passage, free feel
    section: prelude
    movement: free           # held keys walk; the sword swings by itself on every beat
    pace: 30                 # the virtual player's roam speed, world px per world-second
    zone: twilight-glade
    # Full speed: a slowed world makes walking feel like wading. The music's calm goes to the
    # enemies instead, which drift in slowly on a spiral.
    timeScale: 1
    calm: 0.5
    autoSwingBeats: 1
    population: [0, 48]
    roster: { bat: 3, slime: 2, eyeball: 1 }
    camera: { zoom: 1.4, lead: 20, punchOnAccents: false }
    sfxPalette: soft-chimes
    intensity: 0.6
  - bars: 15-30            # galop-vamp — the quiet galop accompaniment: a steady pulse
    section: galop-vamp
    pace: 40
    zone: galop-woods        # the first transform wave sweeps out on its first downbeat
    presses: ".x"            # once per bar, building toward the opening chords
    population: [48, 60]
    camera: { zoom: 1.3, lead: 40 }
    intensity: 0.7
  - bars: 31-53            # galop-opening
    section: galop-opening
    pace: 40
    presses: ".x"            # once per bar; its swing strikes on the downbeat
    heavyOnAccents: { minStrength: 0.7, label: tutti-chord }
    population: [60, 120]
    roster: { slime: 2, goblin: 2, bat: 1 }
    camera: { zoom: 1.2, lead: 50, punchOnAccents: true }
    sfxPalette: crisp-steel
  - bars: 54-69            # theme-a
    section: theme-a
    pace: 50
    presses: "xx"            # every beat of the 2/4 bar (about 180 per minute)
    zone: galop-woods
    # The difficulty curve: a tier-0 player starts taking hits in theme A, bleeds in the kick line
    # and bridge, and falls in the climax; healing is rare (few orc elites, so few chickens).
    population: [120, 200]
    roster: { goblin: 4, slime: 2, orc: 1, bat: 1 }
  - bars: 70-85            # theme-a-repeat
    section: theme-a-repeat
    pace: 55
    population: [200, 280]
    roster: { goblin: 4, orc: 2, slime: 1, bee: 1, orc-elite: 0.05 }
  - bars: 86-101            # kick-line
    section: kick-line
    pace: 45
    presses: ".x"            # once per bar while the line dances
    zone: mushroom-grove
    population: [280, 280]
    roster: { goblin: 3, skeleton: 3, orc: 1, slime: 1 }
    camera: { zoom: 1.0, lead: 230 }
  - bars: 102-107            # bridge
    section: bridge
    pace: 70
    presses: "xx"
    zone: ember-hollow
    population: [350, 420]
    roster: { skeleton: 2, orc-ember: 3, goblin: 2, bat: 1, orc-elite: 0.05 }
    camera: { zoom: 1.05, lead: 60 }
    sfxPalette: heavy-infernal
  - bars: 108-139            # climax
    section: climax
    pace: 20
    zone: infernal-grove
    population: [480, 520]
    roster: { orc-ember: 3, skeleton-ember: 3, goblin: 2, bat: 1, orc-elite: 0.03 }
    camera: { zoom: 0.9, lead: 0 }
  - bars: 140-177            # coda
    section: coda
    pace: 15
    presses: ".x"            # about 115 per minute at 230 BPM
    population: [520, 480]
    intensity: 1

# Level-ups offer three items from the upgrade pool. Experience for each: the moderate player fills
# each bar a little before its moment (with gems on the field it collects them only where it walks:
# about 110-125 by the first, 540-740 between the first and second, and 870-1250 between the second
# and third on the checked seeds).
events:
  - at: { section: galop-opening, point: start }
    levelUp: offer
    xp: 100
  - at: { section: theme-a-repeat, point: start }
    levelUp: offer
    xp: 470
  - at: { section: theme-a-repeat, point: start, offsetBeats: 4 }
    formation: bee-wedge
  - at: { section: theme-a-repeat, phrase: 2, point: start }
    formation: bee-wedge
  - at: { section: kick-line, point: start }
    formation: skeleton-kick-line
    threats: { kind: archer-volley, every: 2 bars, until: { section: kick-line, phrase: 2, point: finalAccent, offsetBeats: -4 }, archers: 2 }
  - at: { section: bridge, point: start }
    levelUp: offer
    xp: 800
  - at: { section: climax, point: start }
    boss: { type: minotaur, slams: 4, slamsUntil: { accent: tutti-chord, fromEnd: 2 } }
    landmark: standing-stones
  - at: { accent: tutti-chord, fromEnd: 2 }
    timeScale: 0.4          # slow motion on the second-to-last chord
  - at: { accent: tutti-chord, fromEnd: 1 }
    blast: finale-blast
    landmark: ruined-shrine
  # Set pieces: closing rings around where the hero stands, each closing on an accent a cleave can
  # meet, and stampedes running across the view.
  - at: { accent: tutti-chord, fromEnd: 6 }           # 0:59.5
    ring: { enemy: goblin, count: 30, gaps: 3, closesOn: { accent: tutti-chord, fromEnd: 5 } }   # 1:02.3
  - at: { bar: 104, beat: 1 }                         # 1:42.0, after the bridge's level-up
    stampede: { enemy: goblin, count: 40, rows: 2 }
  - at: { bar: 118, beat: 2 }                         # 1:51.2
    ring: { enemy: goblin, count: 60, gaps: 3, closesOn: { bar: 126, beat: 2 } }                 # 1:56.2
  - at: { section: coda, point: start }               # 2:04.6
    stampede: { enemy: goblin, count: 60, rows: 3 }
  - at: { bar: 147, beat: 1 }                         # 2:08.8
    ring: { enemy: goblin, count: 80, gaps: 3, closesOn: { bar: 154, beat: 2 } }                 # 2:13.0
