[project]
name = "champions-tools"
version = "0.1.0"
description = "Rhythm Champions' tools: worktree setup, vendor sync and guard, builds, play and checks"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "pillow", "scipy>=1.16"]

[project.scripts]
champions = "champions_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Long extension lists read better as one split string.
ignore = ["SIM905"]
