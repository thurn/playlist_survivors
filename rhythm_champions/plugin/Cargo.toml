# Rhythm Champions' music plugin (docs/champions/plan.md, Decision 2 and What Carries Over): a copy of
# the frozen native/ workspace's plugin, analysis, audio, capture and stream crates, built and
# tested on its own. `champions setup` builds libps_plugin.dylib into the Unity project.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Pedantic where it helps; the noisiest of its lints are allowed (numeric casts are routine in
# DSP and simulation code, and the docs live in the design).
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
float_cmp = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

# The stage parity and causality tests analyse whole excerpts.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
