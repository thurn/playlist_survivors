[package]
name = "plugin"
version = "0.0.0"
edition.workspace = true
publish = false

# libps_plugin.dylib for Unity, and an rlib for the tests that drive its C interface.
[lib]
name = "ps_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
analysis = { path = "../analysis" }
audio = { path = "../audio" }
capture = { path = "../capture" }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
# (Exact floats: a Replay source parses its records back.)
serde_json = { version = "1", features = ["float_roundtrip"] }
stream = { path = "../stream" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"

[lints]
workspace = true
