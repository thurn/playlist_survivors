version = 1

[resources]
# Promotion pauses while `release` trails `staging` by more than this after a failed release run.
max_release_lag = 5

[remote]
enabled = true

# The gate stage (about 60 s, path-gated by the script) blocks promotion to `staging`.
[[step]]
name = "gate"
run = 'CARGO_TARGET_DIR="$HOME/Library/Caches/playlist-survivors/target-gate" ./scripts/ci-gate'
timeout = "15m"
# Shell expansion in run resolves the current user's home. Each step has its own persistent
# target directory outside the slots (S0 measured no gain from sccache).

# The release stage runs on the newest `staging` tip and moves `release` and remote master.
# Each section is its own step, so a ci-fix bead is keyed by the section that failed.
[[step]]
name = "ci-full-baker"
run = "./scripts/ci-full baker"
stage = "release"
needs = []
timeout = "30m"

[[step]]
name = "ci-full-analysis"
run = "./scripts/ci-full analysis"
stage = "release"
needs = []
timeout = "30m"

[[step]]
name = "ci-full-native"
run = 'CARGO_TARGET_DIR="$HOME/Library/Caches/playlist-survivors/target-release" ./scripts/ci-full native'
stage = "release"
needs = []
timeout = "30m"

# SF9: independent target directory for this release step's checkout.
[[step]]
name = "ci-full-survivors"
run = 'CARGO_TARGET_DIR="$HOME/Library/Caches/playlist-survivors/target-release-survivors" ./scripts/ci-full survivors'
stage = "release"
needs = []
timeout = "20m"

# The deterministic 30-minute replay has its own budget and checkout-specific build cache.
[[step]]
name = "ci-full-survivors-replay"
run = 'CARGO_TARGET_DIR="$HOME/Library/Caches/playlist-survivors/target-release-survivors-replay" ./scripts/ci-full survivors-replay'
stage = "release"
needs = []
timeout = "20m"

# The 3D demo: the vendor guard, its tools' tests and the choreography layer's dotnet tests.
[[step]]
name = "ci-full-demo3d"
run = "./scripts/ci-full demo3d"
stage = "release"
needs = []
timeout = "15m"
