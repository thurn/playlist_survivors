# A second hero definition.
# expect: the hero is already defined at content/hero.yaml
hero:
  step: { length: 44, durationMs: 110, hop: 5, diagonalWindowMs: 40 }
  stride: { durationMs: 110, hop: 5, maxPeriodS: 0.4, freePeriodS: 0.35, stompMs: 40 }
  walk: { speed: 80, accelMs: 60, strideCycle: 64 }
  timing: { perfectMs: 35, greatMs: 70, goodMs: 120, floor: 0.1 }
  groove: { follow: 0.3, idleHalfLifeBars: 8, maxBonus: 0.2, offbeatBonus: 0.25 }
  meter: { counted: { perfect: 0.08, great: 0.02, good: -0.05, loose: -0.1 }, offbeat: { perfect: 0.03, great: 0 }, doubleTap: 0, stray: -0.1, drain: { afterBars: 1, emptyInBars: 8 }, tiers: [0.3, 0.6, 0.85], hysteresis: 0.05, doubleTapMs: 100 }
  swings:
    minLeadMs: 90
    windupMs: 190
    light: { animations: [slash, backslash, halfslash], hitShape: { kind: arc, radius: 100, degrees: 150 }, damage: 1.0 }
    heavy: { animation: slash-oversize, hitShape: { kind: arc, radius: 130, degrees: 200 }, damage: 2.5, hitStopMs: 110, wave: { to: 330, band: 25, damage: 1.0 } }
  health: { max: 5000, biteEveryMs: 600, heal: { beat: 15, streakFrom: 4, streak: 15 } }
  # The boss outweighs a crowd of hundreds; formation members draw a cleave to the line.
  aimWeights: { regular: 1, elite: 2, boss: 1000, formation: 20 }
